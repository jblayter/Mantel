# Pin the JDK so the build is reproducible without env juggling.
# Homebrew's standalone `gradle` runs on JDK 25, which is too new for AGP
# 8.7.x — build only via ./gradlew, which reads this file.
org.gradle.java.home=/opt/homebrew/Cellar/openjdk@17/17.0.16/libexec/openjdk.jdk/Contents/Home

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
