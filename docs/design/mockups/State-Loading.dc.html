<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mantel · Waiting for the first reading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=DM+Sans:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2B1E15}
a{color:#93BBD0}a:hover{color:#9ACDE6}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(6px,4px)}}
.drift{animation:drift 900s ease-in-out infinite alternate}
.disp{font-family:'Fraunces',Georgia,serif;font-variant-numeric:tabular-nums}
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
</style>
</helmet>
<div style="width:1920px;height:1080px;box-sizing:border-box;padding:54px 96px;background:#2B1E15;color:#F2E9DA;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden">
<div class="drift" style="height:100%;display:flex;flex-direction:column;gap:24px">

<div style="display:flex;align-items:center;justify-content:space-between;height:64px;flex-shrink:0">
<div style="display:flex;align-items:baseline;gap:22px">
<div class="disp" style="font-size:48px;font-weight:700;color:#F0B45A">Mantel</div>
<div style="font-size:26px;color:#D2C0A6">192.168.6.38</div>
</div>
<div style="display:flex;align-items:baseline;gap:26px">
<div style="font-size:24px;color:#D2C0A6">Sunday</div>
<div class="disp" style="font-size:52px;font-weight:500">2:32</div>
</div>
</div>

<div style="flex:1;min-height:0;display:grid;grid-template-columns:980px minmax(0,1fr);gap:32px">

<section style="display:flex;flex-direction:column;gap:16px;min-height:0">
<div style="display:flex;align-items:center;height:44px">
<div style="font-size:26px;font-weight:700;color:#D2C0A6">The hive · one cell per container</div>
</div>

<div style="display:flex;flex-direction:column;height:618px;flex-shrink:0" aria-hidden="true">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
<div style="display:flex;gap:10px;margin-left:{{row.ml}};margin-top:{{row.mt}}">
<sc-for list="{{row.cells}}" as="c" hint-placeholder-count="4">
<div style="position:relative;width:208px;height:240px;flex-shrink:0">
<div class="hex" style="position:absolute;inset:0;background:#2F2118"></div>
<svg viewBox="0 0 208 240" width="208" height="240" style="position:absolute;inset:0"><polygon points="104,4 204,62 204,178 104,236 4,178 4,62" fill="none" stroke="#6B5442" stroke-width="4" stroke-dasharray="12 10" stroke-linejoin="round"></polygon></svg>
</div>
</sc-for>
</div>
</sc-for>
</div>

<div style="display:flex;align-items:center;gap:14px;font-size:24px;height:44px">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#F0B45A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="9" opacity=".35"></circle><path d="M12 3a9 9 0 0 1 9 9"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1.6s" repeatCount="indefinite"></animateTransform></path></svg>
<span style="color:#EADFCB"><span style="font-weight:700;color:#F0B45A">Waiting</span> for the first reading from 192.168.6.38</span>
</div>
</section>

<section style="display:flex;flex-direction:column;gap:20px;min-height:0;min-width:0">

<div style="background:#3A2A1E;border:3px solid #5C4431;border-radius:8px;padding:20px 26px;display:flex;gap:26px;align-items:center;height:216px;flex-shrink:0">
<div class="disp" style="font-size:124px;font-weight:700;line-height:.85;color:#AD9D87">—</div>
<div style="font-size:24px;font-weight:700;color:#D2C0A6">containers right now</div>
</div>

<div style="display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:16px;height:196px;flex-shrink:0">
<div style="background:#3A2A1E;border:3px solid #5C4431;border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:2px;min-width:0">
<div style="font-size:24px;font-weight:700;color:#D2C0A6">CPU</div>
<div class="disp" style="font-size:54px;font-weight:700;line-height:1;color:#AD9D87">—</div>
</div>
<div style="background:#3A2A1E;border:3px solid #5C4431;border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:2px;min-width:0">
<div style="font-size:24px;font-weight:700;color:#D2C0A6">Memory</div>
<div class="disp" style="font-size:54px;font-weight:700;line-height:1;color:#AD9D87">—</div>
</div>
<div style="background:#3A2A1E;border:3px solid #5C4431;border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:2px;min-width:0">
<div style="font-size:24px;font-weight:700;color:#D2C0A6">Load</div>
<div class="disp" style="font-size:54px;font-weight:700;line-height:1;color:#AD9D87">—</div>
</div>
</div>

<div style="flex:1;min-height:0;background:#3A2A1E;border:3px solid #5C4431;border-radius:8px;padding:18px 26px;display:flex;flex-direction:column;gap:12px">
<div style="font-size:24px;font-weight:700;color:#D2C0A6">Deploys</div>
<div style="font-size:24px;color:#AD9D87">Waiting for the first reading</div>
</div>

</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [{}, {}, {}, {}];
    const rows = [0, 1, 2].map((i) => ({ cells, ml: i === 1 ? '109px' : '0px', mt: i === 0 ? '0px' : '-51px' }));
    return { rows };
  }
}
</script>
</body>
</html>
